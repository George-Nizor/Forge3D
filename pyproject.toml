[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge3d"
version = "0.2.0"
description = "Lean, local-first 3D workflow helpers for Codex, Blender, and Godot"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
forge3d = "forge3d.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
