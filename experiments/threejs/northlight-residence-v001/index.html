<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Northlight Residence — Three.js Architectural Study</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ink: #f5f2ea;
      --muted: #b7bdc2;
      --glass: rgba(12, 16, 19, 0.72);
      --edge: rgba(255, 255, 255, 0.13);
      --accent: #d9a15d;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #9fb7c6; }
    canvas { display: block; width: 100%; height: 100%; }
    .hud {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      color: var(--ink);
    }
    .brand {
      position: absolute;
      top: 24px;
      left: 26px;
      max-width: min(480px, calc(100vw - 52px));
      padding: 17px 19px 16px;
      border: 1px solid var(--edge);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(8, 12, 14, .82), rgba(8, 12, 14, .51));
      box-shadow: 0 20px 60px rgba(0,0,0,.22);
      backdrop-filter: blur(16px) saturate(130%);
    }
    .eyebrow {
      margin-bottom: 7px;
      color: #e4b67a;
      font-size: 10px;
      font-weight: 760;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(20px, 3vw, 34px); line-height: 1; letter-spacing: -.035em; }
    .subtitle { margin: 9px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .controls {
      pointer-events: auto;
      position: absolute;
      right: 22px;
      bottom: 22px;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      max-width: min(650px, calc(100vw - 44px));
      padding: 10px;
      border: 1px solid var(--edge);
      border-radius: 14px;
      background: var(--glass);
      box-shadow: 0 14px 50px rgba(0,0,0,.25);
      backdrop-filter: blur(16px) saturate(130%);
    }
    button {
      appearance: none;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 9px;
      padding: 9px 12px;
      background: rgba(255,255,255,.07);
      color: #f7f5ef;
      font: inherit;
      font-size: 11px;
      font-weight: 680;
      letter-spacing: .02em;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }
    button:hover { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.26); transform: translateY(-1px); }
    button.active { color: #17130f; background: var(--accent); border-color: #ecc18c; }
    .spec {
      position: absolute;
      left: 25px;
      bottom: 24px;
      padding: 10px 12px;
      border-left: 2px solid var(--accent);
      color: rgba(255,255,255,.82);
      background: rgba(7,10,12,.42);
      font-size: 10px;
      line-height: 1.65;
      letter-spacing: .06em;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
    }
    .hint {
      position: absolute;
      top: 26px;
      right: 26px;
      color: rgba(255,255,255,.75);
      font-size: 10px;
      letter-spacing: .06em;
      text-shadow: 0 1px 8px rgba(0,0,0,.5);
      text-transform: uppercase;
    }
    @media (max-width: 700px) {
      .brand { top: 12px; left: 12px; }
      .hint, .spec { display: none; }
      .controls { right: 12px; bottom: 12px; max-width: calc(100vw - 24px); }
      button { padding: 8px 9px; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="hud">
    <section class="brand">
      <div class="eyebrow">Procedural architectural study · 2026</div>
      <h1>Northlight Residence</h1>
      <p class="subtitle">Contemporary craftsman massing, true recessed openings, layered roof geometry and fully procedural materials.</p>
    </section>
    <div class="hint">Drag to orbit · scroll to zoom · right-drag to pan</div>
    <div class="spec">16.8 m frontage<br>Mixed cedar · basalt · steel<br>Z-up authoring · metre scale</div>
    <nav class="controls" aria-label="Scene controls">
      <button id="viewButton">View · Hero</button>
      <button id="doorButton">Open entry</button>
      <button id="timeButton">Night mode</button>
      <button id="orbitButton">Auto orbit</button>
      <button id="detailButton">Details on</button>
    </nav>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

    const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    const scene = new THREE.Scene();
    scene.name = "NorthlightResidenceScene";
    scene.background = new THREE.Color(0xa8c2d0);
    scene.fog = new THREE.FogExp2(0xa8c2d0, 0.011);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 120);
    camera.position.set(18.5, 10.6, 23.5);

    const renderer = new THREE.WebGLRenderer({ antialias: !mobile, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1.5 : 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    document.body.prepend(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3.2, 0.6);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.minDistance = 8;
    controls.maxDistance = 48;
    controls.maxPolarAngle = Math.PI * 0.47;

    const pmrem = new THREE.PMREMGenerator(renderer);
    const roomEnvironment = new RoomEnvironment();
    scene.environment = pmrem.fromScene(roomEnvironment, 0.04).texture;
    roomEnvironment.dispose();
    pmrem.dispose();

    const sun = new THREE.DirectionalLight(0xfff1d3, 4.0);
    sun.name = "LateAfternoonSun";
    sun.position.set(-10, 17, 11);
    sun.castShadow = true;
    sun.shadow.mapSize.set(mobile ? 1536 : 3072, mobile ? 1536 : 3072);
    sun.shadow.camera.left = -20;
    sun.shadow.camera.right = 20;
    sun.shadow.camera.top = 18;
    sun.shadow.camera.bottom = -12;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 50;
    sun.shadow.bias = -0.00025;
    sun.shadow.normalBias = 0.028;
    scene.add(sun);

    const ambient = new THREE.HemisphereLight(0xb9d7e7, 0x53604a, 1.75);
    ambient.name = "SkyGroundFill";
    scene.add(ambient);

    const entryLight = new THREE.PointLight(0xffb75e, 0, 9, 2);
    entryLight.name = "EntryLight";
    entryLight.position.set(-1.05, 3.0, 4.55);
    entryLight.castShadow = false;
    scene.add(entryLight);

    const textures = [];
    const materials = [];
    const geometries = new Set();
    const staticGroups = [];
    const animated = { night: 0, door: 0, detail: 1 };

    function seeded(seed = 1) {
      let value = seed >>> 0;
      return () => {
        value += 0x6D2B79F5;
        let t = value;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function proceduralTexture(size, repeatX, repeatY, painter) {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = size;
      const context = canvas.getContext("2d");
      painter(context, size);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(repeatX, repeatY);
      texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      textures.push(texture);
      return texture;
    }

    const cedarMap = proceduralTexture(512, 4, 5, (ctx, size) => {
      const random = seeded(10);
      ctx.fillStyle = "#9a7551";
      ctx.fillRect(0, 0, size, size);
      const rowH = 48;
      for (let row = -1; row < size / rowH + 1; row++) {
        const offset = row % 2 ? -26 : 0;
        for (let x = offset; x < size; x += 52) {
          const y = row * rowH;
          const tone = 114 + Math.floor(random() * 47);
          ctx.fillStyle = `rgb(${tone + 28},${tone + 4},${Math.max(62, tone - 25)})`;
          ctx.fillRect(x + 1, y + 2, 49, rowH - 4);
          ctx.strokeStyle = "rgba(48,31,18,.35)";
          ctx.strokeRect(x + 1, y + 2, 49, rowH - 4);
          for (let grain = 0; grain < 3; grain++) {
            ctx.strokeStyle = `rgba(255,240,210,${0.035 + random() * .04})`;
            ctx.beginPath();
            ctx.moveTo(x + 6 + random() * 35, y + 5);
            ctx.lineTo(x + 4 + random() * 39, y + rowH - 6);
            ctx.stroke();
          }
        }
      }
    });

    const basaltMap = proceduralTexture(512, 3, 3, (ctx, size) => {
      const random = seeded(22);
      ctx.fillStyle = "#6e706c";
      ctx.fillRect(0, 0, size, size);
      const rowH = 54;
      for (let row = 0; row <= size / rowH; row++) {
        let x = row % 2 ? -45 : -8;
        while (x < size) {
          const width = 45 + random() * 85;
          const y = row * rowH;
          const tone = 65 + random() * 55;
          ctx.fillStyle = `rgb(${tone + 15},${tone + 14},${tone + 9})`;
          ctx.fillRect(x + 3, y + 3, width - 6, rowH - 6);
          ctx.strokeStyle = "rgba(205,201,190,.55)";
          ctx.lineWidth = 4;
          ctx.strokeRect(x + 1, y + 1, width - 2, rowH - 2);
          x += width;
        }
      }
      for (let i = 0; i < 1800; i++) {
        ctx.fillStyle = `rgba(255,255,255,${random() * .06})`;
        ctx.fillRect(random() * size, random() * size, 1, 1);
      }
    });

    const charcoalMap = proceduralTexture(512, 5, 4, (ctx, size) => {
      const random = seeded(32);
      ctx.fillStyle = "#293034";
      ctx.fillRect(0, 0, size, size);
      const strip = 32;
      for (let x = 0; x < size; x += strip) {
        const tone = 34 + Math.floor(random() * 13);
        ctx.fillStyle = `rgb(${tone},${tone + 7},${tone + 9})`;
        ctx.fillRect(x + 3, 0, strip - 6, size);
        ctx.fillStyle = "rgba(0,0,0,.33)";
        ctx.fillRect(x, 0, 3, size);
        ctx.fillStyle = "rgba(255,255,255,.045)";
        ctx.fillRect(x + 3, 0, 1, size);
      }
    });

    const slateMap = proceduralTexture(512, 5, 5, (ctx, size) => {
      const random = seeded(47);
      ctx.fillStyle = "#252a2c";
      ctx.fillRect(0, 0, size, size);
      const h = 32;
      for (let row = 0; row < size / h; row++) {
        for (let x = (row % 2 ? -24 : 0); x < size; x += 48) {
          const tone = 29 + Math.floor(random() * 18);
          ctx.fillStyle = `rgb(${tone},${tone + 3},${tone + 5})`;
          ctx.fillRect(x + 1, row * h + 1, 46, h - 3);
          ctx.strokeStyle = "rgba(0,0,0,.42)";
          ctx.strokeRect(x + 1, row * h + 1, 46, h - 3);
        }
      }
    });

    const timberMap = proceduralTexture(512, 2, 4, (ctx, size) => {
      const random = seeded(58);
      const gradient = ctx.createLinearGradient(0, 0, size, 0);
      gradient.addColorStop(0, "#5d3925");
      gradient.addColorStop(.5, "#a56b3f");
      gradient.addColorStop(1, "#4e2e20");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      for (let i = 0; i < 120; i++) {
        ctx.strokeStyle = `rgba(${random() > .5 ? "255,213,162" : "38,17,8"},${.03 + random() * .1})`;
        ctx.lineWidth = 1 + random() * 2;
        ctx.beginPath();
        const x = random() * size;
        ctx.moveTo(x, 0);
        ctx.bezierCurveTo(x + random() * 24 - 12, size * .3, x + random() * 35 - 17, size * .72, x + random() * 18 - 9, size);
        ctx.stroke();
      }
    });

    const concreteMap = proceduralTexture(512, 3, 3, (ctx, size) => {
      const random = seeded(67);
      ctx.fillStyle = "#a8a59d";
      ctx.fillRect(0, 0, size, size);
      for (let i = 0; i < 10000; i++) {
        const tone = random() > .5 ? 255 : 30;
        ctx.fillStyle = `rgba(${tone},${tone},${tone},${random() * .055})`;
        const r = random() * 2.3;
        ctx.fillRect(random() * size, random() * size, r, r);
      }
    });

    const lawnMap = proceduralTexture(512, 6, 6, (ctx, size) => {
      const random = seeded(79);
      ctx.fillStyle = "#50623a";
      ctx.fillRect(0, 0, size, size);
      for (let i = 0; i < 15000; i++) {
        const green = 58 + random() * 70;
        ctx.strokeStyle = `rgba(${green * .55},${green},${green * .38},${.18 + random() * .45})`;
        const x = random() * size;
        const y = random() * size;
        ctx.beginPath();
        ctx.moveTo(x, y + 3);
        ctx.lineTo(x + random() * 3 - 1.5, y);
        ctx.stroke();
      }
    });

    const terrazzoMap = proceduralTexture(512, 2, 2, (ctx, size) => {
      const random = seeded(83);
      ctx.fillStyle = "#d0cbc0";
      ctx.fillRect(0, 0, size, size);
      for (let i = 0; i < 900; i++) {
        const hues = ["#7e7469", "#eee7d8", "#655f5a", "#b99878"];
        ctx.fillStyle = hues[Math.floor(random() * hues.length)];
        const x = random() * size, y = random() * size, r = 1 + random() * 4;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    function standard(parameters) {
      const material = new THREE.MeshStandardMaterial(parameters);
      materials.push(material);
      return material;
    }

    const mat = {
      cedar: standard({ map: cedarMap, color: 0xc59a6e, roughness: .82, metalness: 0 }),
      basalt: standard({ map: basaltMap, color: 0x777973, roughness: .93 }),
      charcoal: standard({ map: charcoalMap, color: 0x3e484b, roughness: .78 }),
      slate: standard({ map: slateMap, color: 0x343b3e, roughness: .72 }),
      metalRoof: standard({ color: 0x2c3235, roughness: .38, metalness: .7 }),
      blackMetal: standard({ color: 0x111719, roughness: .3, metalness: .75 }),
      bronze: standard({ color: 0x8c5d32, roughness: .27, metalness: .82 }),
      timber: standard({ map: timberMap, color: 0xb47a4e, roughness: .62 }),
      whiteTrim: standard({ color: 0xe9e5db, roughness: .54 }),
      warmWhite: standard({ color: 0xd6d2c8, roughness: .68 }),
      concrete: standard({ map: concreteMap, color: 0xc3bfb5, roughness: .9 }),
      terrazzo: standard({ map: terrazzoMap, color: 0xdad4c8, roughness: .75 }),
      lawn: standard({ map: lawnMap, color: 0x708758, roughness: 1 }),
      soil: standard({ color: 0x2d2118, roughness: 1 }),
      bark: standard({ color: 0x554331, roughness: 1 }),
      leafDark: standard({ color: 0x24462e, roughness: .88 }),
      leafLight: standard({ color: 0x4e7846, roughness: .88 }),
      warmInterior: standard({ color: 0x5b4934, emissive: 0xffa94d, emissiveIntensity: .22, roughness: .9 }),
      curtain: standard({ color: 0xb5a999, roughness: 1 }),
      water: new THREE.MeshPhysicalMaterial({
        color: 0x9fc4c7, roughness: .12, metalness: 0, transmission: .45,
        transparent: true, opacity: .78, thickness: .3, ior: 1.33
      }),
      glass: new THREE.MeshPhysicalMaterial({
        color: 0xa7c4cf, roughness: .08, metalness: .06, transmission: .74,
        transparent: true, opacity: .58, thickness: .18, ior: 1.48, envMapIntensity: 1.45
      })
    };
    materials.push(mat.water, mat.glass);

    const unitBox = new THREE.BoxGeometry(1, 1, 1);
    const unitCylinder = new THREE.CylinderGeometry(1, 1, 1, 16);
    const unitSphere = new THREE.IcosahedronGeometry(1, 2);
    geometries.add(unitBox);
    geometries.add(unitCylinder);
    geometries.add(unitSphere);

    function meshFrom(geometry, material, name, parent = scene) {
      geometries.add(geometry);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.name = name;
      parent.add(mesh);
      return mesh;
    }

    function box(size, position, material, name, parent = scene, options = {}) {
      const mesh = new THREE.Mesh(unitBox, material);
      mesh.name = name;
      mesh.position.set(...position);
      mesh.scale.set(...size);
      mesh.rotation.set(...(options.rotation ?? [0, 0, 0]));
      mesh.castShadow = options.castShadow ?? true;
      mesh.receiveShadow = options.receiveShadow ?? true;
      parent.add(mesh);
      return mesh;
    }

    function cylinder(radius, height, position, material, name, parent = scene, options = {}) {
      const mesh = new THREE.Mesh(unitCylinder, material);
      mesh.name = name;
      mesh.scale.set(radius, height, radius);
      mesh.position.set(...position);
      mesh.rotation.set(...(options.rotation ?? [0, 0, 0]));
      mesh.castShadow = options.castShadow ?? true;
      mesh.receiveShadow = options.receiveShadow ?? true;
      parent.add(mesh);
      return mesh;
    }

    const residence = new THREE.Group();
    residence.name = "NorthlightResidence";
    residence.userData = {
      units: "metres",
      upAxis: "Y (Three.js); authoring convention corresponds to Blender Z-up",
      style: "contemporary craftsman",
      textures: "procedural canvas maps",
      exportIntent: "visual benchmark before GLB/Godot pipeline"
    };
    scene.add(residence);

    function wallWithOpenings({ x, bottom, width, height, front, depth, material, openings = [], name, parent = residence }) {
      const xLines = [-width / 2, width / 2];
      const yLines = [0, height];
      for (const opening of openings) {
        xLines.push(opening.x - opening.w / 2, opening.x + opening.w / 2);
        yLines.push(opening.y, opening.y + opening.h);
      }
      xLines.sort((a, b) => a - b);
      yLines.sort((a, b) => a - b);
      const uniqueX = [...new Set(xLines.map(value => +value.toFixed(4)))];
      const uniqueY = [...new Set(yLines.map(value => +value.toFixed(4)))];
      const group = new THREE.Group();
      group.name = name;
      parent.add(group);
      for (let ix = 0; ix < uniqueX.length - 1; ix++) {
        for (let iy = 0; iy < uniqueY.length - 1; iy++) {
          const left = uniqueX[ix], right = uniqueX[ix + 1];
          const low = uniqueY[iy], high = uniqueY[iy + 1];
          const midX = (left + right) / 2, midY = (low + high) / 2;
          const removed = openings.some(opening =>
            midX > opening.x - opening.w / 2 + .001 &&
            midX < opening.x + opening.w / 2 - .001 &&
            midY > opening.y + .001 &&
            midY < opening.y + opening.h - .001
          );
          if (!removed) {
            box(
              [right - left, high - low, depth],
              [x + midX, bottom + midY, front - depth / 2],
              material,
              `${name}_Panel_${ix}_${iy}`,
              group
            );
          }
        }
      }
      return group;
    }

    function gableFace({ x, eave, width, rise, front, depth, material, name, parent = residence }) {
      const shape = new THREE.Shape();
      shape.moveTo(-width / 2, 0);
      shape.lineTo(width / 2, 0);
      shape.lineTo(0, rise);
      shape.closePath();
      const geometry = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
      const mesh = meshFrom(geometry, material, name, parent);
      mesh.position.set(x, eave, front - depth);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function frontGableRoof({ x, z, eave, width, depth, rise, material, name, seams = true, parent = residence }) {
      const group = new THREE.Group();
      group.name = name;
      parent.add(group);
      const run = width / 2 + .42;
      const slope = Math.hypot(run, rise + .18);
      const pitch = Math.atan2(rise + .18, run);
      for (const side of [-1, 1]) {
        const plane = new THREE.Group();
        plane.name = `${name}_${side < 0 ? "Left" : "Right"}Assembly`;
        plane.position.set(x + side * run / 2, eave + rise / 2 + .08, z);
        plane.rotation.z = side < 0 ? pitch : -pitch;
        group.add(plane);
        box(
          [slope, .16, depth + .85],
          [0, 0, 0],
          material,
          `${name}_${side < 0 ? "Left" : "Right"}Plane`,
          plane
        );
        if (seams) {
          for (let seam = -Math.floor(depth / .7); seam <= Math.floor(depth / .7); seam++) {
            box(
              [slope * .98, .035, .028],
              [0, .105, seam * .7],
              mat.blackMetal,
              `${name}_StandingSeam`,
              plane,
              { castShadow: false }
            );
          }
        }
      }
      box([.14, .18, depth + 1.0], [x, eave + rise + .14, z], mat.blackMetal, `${name}_Ridge`, group);
      return group;
    }

    function sideGableRoof({ x, z, eave, width, depth, rise, material, name, parent = residence }) {
      const group = new THREE.Group();
      group.name = name;
      parent.add(group);
      const run = depth / 2 + .5;
      const slope = Math.hypot(run, rise);
      const pitch = Math.atan2(rise, run);
      for (const side of [-1, 1]) {
        const plane = new THREE.Group();
        plane.name = `${name}_${side < 0 ? "Rear" : "Front"}Assembly`;
        plane.position.set(x, eave + rise / 2, z + side * run / 2);
        plane.rotation.x = side > 0 ? pitch : -pitch;
        group.add(plane);
        box(
          [width + 1.0, .16, slope],
          [0, 0, 0],
          material,
          `${name}_${side < 0 ? "Rear" : "Front"}Plane`,
          plane
        );
        for (let seam = -Math.floor(width / .75); seam <= Math.floor(width / .75); seam++) {
          box(
            [.026, .035, slope * .98],
            [seam * .75, .105, 0],
            mat.blackMetal,
            `${name}_StandingSeam`,
            plane,
            { castShadow: false }
          );
        }
      }
      box([width + 1.1, .18, .14], [x, eave + rise + .11, z], mat.blackMetal, `${name}_Ridge`, group);
      return group;
    }

    function revealFrame({ x, bottom, w, h, z, material, name, parent = residence }) {
      const group = new THREE.Group();
      group.name = `${name}_DeepReveal`;

        pineCrowns.setMatrixAt(crownIndex++, dummy.matrix);
      }
    });
    pineTrunks.instanceMatrix.needsUpdate = true;
    pineCrowns.instanceMatrix.needsUpdate = true;
    pineTrunks.castShadow = pineCrowns.castShadow = true;
    pineTrunks.receiveShadow = pineCrowns.receiveShadow = true;
    scene.add(pineTrunks, pineCrowns);

    // Boulders add irregular foreground scale cues.
    const boulderGeometry = new THREE.DodecahedronGeometry(1, 1);
    geometries.add(boulderGeometry);
    const boulders = [
      [-8.1, .45, 8.3, 1.1], [-7.1, .32, 8.7, .7], [9.8, .42, 9.7, 1.0],
      [10.6, .28, 8.9, .62], [2.0, .22, 9.4, .48]
    ];
    boulders.forEach(([x, y, z, scale], index) => {
      const rock = new THREE.Mesh(boulderGeometry, mat.basalt);
      rock.name = "LandscapeBoulder";
      rock.position.set(x, y, z);
      rock.scale.set(scale, scale * (.55 + index * .04), scale * .82);
      rock.rotation.set(index * .3, index * .8, index * .17);
      rock.castShadow = true;
      rock.receiveShadow = true;
      scene.add(rock);
    });

    // Low detail extras may be toggled for a cleaner massing view.
    const details = new THREE.Group();
    details.name = "OptionalMicroDetails";
    residence.add(details);
    for (let i = 0; i < 18; i++) {
      const x = -6.35 + (i % 6) * .25;
      const y = 1.0 + Math.floor(i / 6) * .22;
      box([.17, .08, .035], [x, y, 4.31], i % 3 ? mat.basalt : mat.terrazzo, "FeatureStoneRelief", details);
    }
    for (let i = 0; i < 9; i++) {
      box([.026, 1.65, .04], [1.85 + i * .18, 4.84, 3.82], mat.warmWhite, "CedarScreenBatten", details);
    }

    // Fake soft contact shadow beneath the architecture.
    const shadowCanvas = document.createElement("canvas");
    shadowCanvas.width = shadowCanvas.height = 256;
    const shadowCtx = shadowCanvas.getContext("2d");
    const shadowGradient = shadowCtx.createRadialGradient(128, 128, 12, 128, 128, 125);
    shadowGradient.addColorStop(0, "rgba(0,0,0,.42)");
    shadowGradient.addColorStop(.62, "rgba(0,0,0,.19)");
    shadowGradient.addColorStop(1, "rgba(0,0,0,0)");
    shadowCtx.fillStyle = shadowGradient;
    shadowCtx.fillRect(0, 0, 256, 256);
    const shadowTexture = new THREE.CanvasTexture(shadowCanvas);
    textures.push(shadowTexture);
    const shadowMaterial = new THREE.MeshBasicMaterial({ map: shadowTexture, transparent: true, depthWrite: false });
    materials.push(shadowMaterial);
    const contactShadow = new THREE.Mesh(new THREE.PlaneGeometry(19, 12), shadowMaterial);
    geometries.add(contactShadow.geometry);
    contactShadow.name = "BakedContactShadow";
    contactShadow.rotation.x = -Math.PI / 2;
    contactShadow.position.set(0, .01, -.8);
    scene.add(contactShadow);

    const views = [
      { name: "Hero", position: new THREE.Vector3(18.5, 10.6, 23.5), target: new THREE.Vector3(-.4, 3.25, .9) },
      { name: "Entry", position: new THREE.Vector3(-6.2, 4.25, 11.2), target: new THREE.Vector3(-1.2, 2.3, 3.1) },
      { name: "Gables", position: new THREE.Vector3(12.5, 9.8, 14.8), target: new THREE.Vector3(1.2, 5.2, .7) },
      { name: "Pool", position: new THREE.Vector3(13.7, 4.8, 12.0), target: new THREE.Vector3(4.2, 2.3, 2.4) },
      { name: "Massing", position: new THREE.Vector3(-18, 14, 18), target: new THREE.Vector3(-.2, 3.4, -.4) }
    ];
    let viewIndex = 0;
    let cameraBlend = 0;
    const cameraStart = new THREE.Vector3();
    const targetStart = new THREE.Vector3();

    function selectView(index) {
      viewIndex = index % views.length;
      cameraStart.copy(camera.position);
      targetStart.copy(controls.target);
      cameraBlend = 1;
      document.querySelector("#viewButton").textContent = `View · ${views[viewIndex].name}`;
    }

    const viewButton = document.querySelector("#viewButton");
    const doorButton = document.querySelector("#doorButton");
    const timeButton = document.querySelector("#timeButton");
    const orbitButton = document.querySelector("#orbitButton");
    const detailButton = document.querySelector("#detailButton");
    let doorTarget = 0;
    let nightTarget = 0;

    viewButton.addEventListener("click", () => selectView(viewIndex + 1));
    doorButton.addEventListener("click", () => {
      doorTarget = doorTarget ? 0 : 1;
      doorButton.textContent = doorTarget ? "Close entry" : "Open entry";
      doorButton.classList.toggle("active", Boolean(doorTarget));
    });
    timeButton.addEventListener("click", () => {
      nightTarget = nightTarget ? 0 : 1;
      timeButton.textContent = nightTarget ? "Day mode" : "Night mode";
      timeButton.classList.toggle("active", Boolean(nightTarget));
    });
    orbitButton.addEventListener("click", () => {
      controls.autoRotate = !controls.autoRotate;
      controls.autoRotateSpeed = .55;
      orbitButton.classList.toggle("active", controls.autoRotate);
    });
    detailButton.addEventListener("click", () => {
      details.visible = !details.visible;
      detailButton.textContent = details.visible ? "Details on" : "Details off";
      detailButton.classList.toggle("active", details.visible);
    });
    detailButton.classList.add("active");

    const dayBackground = new THREE.Color(0xa8c2d0);
    const nightBackground = new THREE.Color(0x101923);
    const dayFog = new THREE.Color(0xa8c2d0);
    const nightFog = new THREE.Color(0x101923);
    const daySun = new THREE.Color(0xfff1d3);
    const nightSun = new THREE.Color(0x7186ad);
    const clock = new THREE.Clock();

    function damp(current, target, lambda, delta) {
      return THREE.MathUtils.lerp(current, target, 1 - Math.exp(-lambda * delta));
    }

    function animate() {
      const delta = Math.min(clock.getDelta(), .05);
      animated.door = damp(animated.door, doorTarget, 5.2, delta);
      animated.night = damp(animated.night, nightTarget, 2.1, delta);
      doorPivot.rotation.y = -animated.door * Math.PI * .47;

      const n = animated.night;
      scene.background.copy(dayBackground).lerp(nightBackground, n);
      scene.fog.color.copy(dayFog).lerp(nightFog, n);
      sun.color.copy(daySun).lerp(nightSun, n);
      sun.intensity = THREE.MathUtils.lerp(4.0, .16, n);
      ambient.intensity = THREE.MathUtils.lerp(1.75, .35, n);
      entryLight.intensity = THREE.MathUtils.lerp(0, 48, n);
      mat.warmInterior.emissiveIntensity = THREE.MathUtils.lerp(.22, 2.8, n);
      renderer.toneMappingExposure = THREE.MathUtils.lerp(1.08, .92, n);

      if (cameraBlend > .001) {
        cameraBlend = damp(cameraBlend, 0, 3.2, delta);
        const eased = 1 - cameraBlend;
        const smooth = eased * eased * (3 - 2 * eased);
        camera.position.lerpVectors(cameraStart, views[viewIndex].position, smooth);
        controls.target.lerpVectors(targetStart, views[viewIndex].target, smooth);
      }
      controls.update(delta);
      renderer.render(scene, camera);
    }
    renderer.setAnimationLoop(animate);

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1.5 : 2));
    }
    addEventListener("resize", resize);

    function disposeScene() {
      renderer.setAnimationLoop(null);
      controls.dispose();
      for (const geometry of geometries) geometry.dispose();
      for (const material of materials) material.dispose();
      for (const texture of textures) texture.dispose();
      scene.environment?.dispose();
      renderer.dispose();
    }
    addEventListener("pagehide", disposeScene, { once: true });
  </script>
</body>
</html>
